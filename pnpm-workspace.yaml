packages:
  - '.'
  - 'examples/*'
allowBuilds:
  core-js: false

# Network resilience: retry flaky registry requests with exponential backoff (times in ms).
fetchRetries: 5
fetchRetryFactor: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
fetchTimeout: 120000

# Supply chain: only resolve versions published at least 3 days ago (value in minutes).
minimumReleaseAge: 4320
