name: ✨ Feature request
description: Suggest an idea or an improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For questions or help, please use [Discussions](https://github.com/yichenzhu1337/rspack-plugin-svg-sprite/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Example config or API usage helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
  - type: dropdown
    id: parity
    attributes:
      label: Does svg-sprite-loader support this?
      description: This project is a drop-in replacement, so parity with svg-sprite-loader matters for migrations.
      options:
        - 'Yes'
        - 'No'
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Would you be willing to send a PR?
      options:
        - 'Yes'
        - Maybe, with guidance
        - 'No'
    validations:
      required: true
