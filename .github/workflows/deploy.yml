name: 🚀 Deploy the demo and docs

on:
  # Only CI runs for pushes to main deploy (see the `if` below). This workflow checks out the
  # default branch, never code from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers] filtered to push events on main; no untrusted checkout or artifacts
    workflows: ['🔍 CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build the demo and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: the output is deployed.
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: ⚙️ Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build the package
        run: bun run build
      - name: 🏗️ Build the demo with the GitHub Pages base path
        run: bun run --filter svg-sprite-consumer-demo build
        env:
          PUBLIC_PATH: /rspack-plugin-svg-sprite/
      - name: 📚 Build the docs (served under /docs/)
        run: bun run --filter rspack-plugin-svg-sprite-docs build
      # The demo stays at the site root, because links to it exist; the docs go in docs/.
      - name: 🧩 Assemble the Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site/docs
          cp -R examples/react-rspack/dist/. _site/
          cp -R website/doc_build/. _site/docs/
          test -f _site/index.html
          test -f _site/docs/index.html
      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 📦 Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
