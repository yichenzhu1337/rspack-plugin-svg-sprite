coverage:
  status:
    project:
      default:
        target: 99%
    patch:
      default:
        target: 99%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  behavior: default
  require_changes: 'coverage_drop OR uncovered_patch'
  require_base: false
  require_head: true

ignore:
  - 'examples/**'
  - 'dist/**'
  - 'src/__tests__/**'
