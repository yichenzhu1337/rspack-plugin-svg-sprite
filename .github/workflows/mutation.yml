name: Mutation testing

# Report only. Stryker mutates the loader, the plugin and the runtime modules and checks that the
# unit tests notice. The score is written to the job summary and the HTML report is uploaded as an
# artifact. Nothing here runs on pull requests, and a low score never fails the job.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutation:
    name: 🧬 Mutation score
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧬 Run Stryker
        # A surviving mutant is a finding, not a failure, so never fail the job here.
        continue-on-error: true
        run: pnpm test:mutation

      - name: 📝 Write the score to the job summary
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            const out = process.env.GITHUB_STEP_SUMMARY;
            const file = "reports/mutation/mutation.json";
            if (!existsSync(file)) {
              appendFileSync(out, "## Mutation testing\n\nNo report was produced.\n");
              process.exit(0);
            }
            const report = JSON.parse(readFileSync(file, "utf8"));
            let rows = "";
            const total = { killed: 0, survived: 0, noCoverage: 0, timeout: 0, other: 0 };
            for (const [name, data] of Object.entries(report.files)) {
              const count = { killed: 0, survived: 0, noCoverage: 0, timeout: 0, other: 0 };
              for (const mutant of data.mutants) {
                const key = { Killed: "killed", Survived: "survived", NoCoverage: "noCoverage", Timeout: "timeout" }[mutant.status] ?? "other";
                count[key] += 1;
                total[key] += 1;
              }
              const score = (c) => {
                const detected = c.killed + c.timeout;
                const valid = detected + c.survived + c.noCoverage;
                return valid === 0 ? "n/a" : ((detected / valid) * 100).toFixed(1) + "%";
              };
              rows += `| \`${name}\` | ${score(count)} | ${count.killed + count.timeout} | ${count.survived} | ${count.noCoverage} |\n`;
              total.score = score(total);
            }
            const summary = [
              "## Mutation testing",
              "",
              `**Mutation score: ${total.score}**`,
              "",
              "| File | Score | Killed | Survived | No coverage |",
              "| --- | --- | --- | --- | --- |",
              rows.trimEnd(),
              "",
              "The HTML report is attached to this run as the `mutation-report` artifact.",
              "",
            ].join("\n");
            appendFileSync(out, summary);
          '

      - name: 📤 Upload the HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
