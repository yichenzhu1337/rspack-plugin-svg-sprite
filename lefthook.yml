# Git hooks. Install with `pnpm exec lefthook install` (runs on `pnpm install` via `prepare`).
# Personal overrides go in lefthook-local.yml, which is git-ignored.
pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: '*.{ts,tsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{ts,tsx,json,md,yaml,yml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

# Strips co-author trailers so commits are attributed to the committer only.
commit-msg:
  jobs:
    - name: strip-trailers
      run: node scripts/hooks/strip-trailers.mjs {1}
