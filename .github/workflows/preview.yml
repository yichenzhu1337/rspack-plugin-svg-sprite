name: 📦 PR preview package

# Publishes an installable build of each pull request to pkg.pr.new (nothing goes to npm) and
# comments the install command on the PR, so a fix can be tried before it is released.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'client.d.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/preview.yml'

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: 📦 Publish preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: ⚙️ Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 📦 Cache Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build
        run: bun run build
      - name: 🚀 Publish to pkg.pr.new
        # Not an npm publish: pkg.pr.new authenticates through its GitHub App, with no token.
        run: bunx pkg-pr-new@0.0.93 publish --comment=update --packageManager=npm,pnpm,bun # zizmor: ignore[use-trusted-publishing]
