name: 🔍 CI

# Lanes:
#   fast  every pull request and the Release workflow: Node from .nvmrc on ubuntu-24.04, with coverage
#   full  pushes to main and pull requests labelled `full-ci`: Node 22/24/26 on Linux, Windows, macOS
# Docs-only pull requests skip the tests, the example builds and the package checks.
# `ci-ok` is the single required check: it fails when any job failed or was cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so that adding `full-ci` starts the full lane. Every run does the full set of
    # checks for its event, so a run started by a label never weakens the result of an earlier one.
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token (optional; uploads are best effort)
        required: false

permissions: {}

# Keyed by workflow and event, so a Release run that calls this workflow never cancels a push run
# (or the reverse). Only superseded pull request runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      package: ${{ steps.classify.outputs.package }}
      examples: ${{ steps.classify.outputs.examples }}
      ci: ${{ steps.classify.outputs.ci }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: 📥 Check out the merge commit and its base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🧭 Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request (push to main, Release, other callers) runs everything.
          package=true examples=true ci=true docs_only=false full=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = pull_request ] && [ "$FULL_CI_LABEL" = true ]; }; then
            full=true
          fi
          # The pull_request checkout is the merge commit, so HEAD^1 is the base branch tip.
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only HEAD^1 HEAD); then
            package=false examples=false ci=false docs_only=true count=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              count=$((count + 1))
              is_docs=false
              case "$f" in
                src/* | scripts/* | .github/workflows/*) ;;
                *.md | LICENSE) is_docs=true ;;
              esac
              # The published package: sources, manifests, build config and the shipped docs.
              case "$f" in
                src/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | tsconfig*.json | \
                  client.d.ts | rstest.config.ts | .npmrc | .nvmrc | README.md | CHANGELOG.md | LICENSE)
                  package=true ;;
              esac
              case "$f" in examples/*) examples=true ;; esac
              case "$f" in .github/* | scripts/*) ci=true ;; esac
              [ "$is_docs" = true ] || docs_only=false
            done <<< "$files"
            # Be conservative: an empty diff is not proof that nothing needs testing.
            [ "$count" -gt 0 ] || docs_only=false
            echo "::group::📄 $count changed files"
            echo "$files"
            echo "::endgroup::"
          fi
          {
            echo "docs_only=$docs_only"
            echo "package=$package"
            echo "examples=$examples"
            echo "ci=$ci"
            echo "full=$full"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: 🧹 Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔷 Type-check
        run: pnpm typecheck
      - name: 🧹 Lint
        run: pnpm lint
      - name: 🧹 Check formatting
        run: pnpm format:check

  knip:
    name: 🧹 Unused code and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧹 Run knip
        run: pnpm knip

  test:
    name: 🧪 Test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧪 Run the tests with coverage
        run: pnpm test:ci
      - name: 📊 Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-matrix:
    name: 🧪 Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: changes
    # Never on the Release path (workflow_call): `full` is only true for pushes and `full-ci` PRs.
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧪 Run the tests
        run: pnpm test

  build-examples:
    name: 🏗️ Build examples
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build the package
        run: pnpm build
      - name: 🏗️ Build the React + Rspack demo
        run: pnpm --filter svg-sprite-consumer-demo build
      - name: 🏗️ Build the React + webpack demo
        run: pnpm --filter svg-sprite-webpack-demo build
      - name: 🏗️ Build the Vue + Rspack extract demo
        run: pnpm --filter svg-sprite-vue-extract-demo build

  package:
    name: 📦 Package checks
    needs: changes
    if: needs.changes.outputs.package == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 📦 Check the package
        run: pnpm check:package

  actionlint:
    name: 🔍 actionlint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔍 Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # Uses the runner's shellcheck for run: scripts.
          "$RUNNER_TEMP/actionlint" -color

  zizmor:
    name: 🔒 zizmor
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 Audit the workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

  ci-ok:
    name: ci-ok
    needs: [changes, lint, knip, test, test-matrix, build-examples, package, actionlint, zizmor]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: ✅ Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::❌ Failed or cancelled: $bad"
            exit 1
          fi
          echo "✅ All jobs passed or were skipped"
