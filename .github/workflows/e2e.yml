name: E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'e2e/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'e2e/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: 🧪 ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: 📥 Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: ⚙️ Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Cache Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Read the Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(bun run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: 🌐 Install the browser
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: bun run playwright install --with-deps "$BROWSER"

      - name: 🧪 Run the tests
        env:
          BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: bun run test:e2e --project="$BROWSER"

      - name: 📊 Write the summary
        if: always()
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/summary.mjs "$BROWSER" results.json

      - name: 📎 Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
