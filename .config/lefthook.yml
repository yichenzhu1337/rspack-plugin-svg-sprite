# Git hooks. Install with `bun run lefthook install` (runs on `bun install` via `prepare`).
# Personal overrides go in lefthook-local.yml, which is git-ignored.
pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: '*.{ts,tsx,mts}'
      run: bun run oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{ts,tsx,mts,json,md,yaml,yml}'
      run: bun run oxfmt {staged_files}
      stage_fixed: true

# Strips co-author trailers so commits are attributed to the committer only.
commit-msg:
  jobs:
    - name: strip-trailers
      run: node scripts/hooks/strip-trailers.mts {1}
