name: Version PR

# Keeps a "chore: version packages" pull request up to date while unreleased changesets exist on
# main. Merging it bumps the version and writes CHANGELOG.md. It never publishes: releasing is the
# manual Release workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-pr
  cancel-in-progress: false

jobs:
  version-pr:
    name: Update the version PR
    # Skips until the release bot GitHub App is configured.
    if: vars.RELEASE_BOT_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A GitHub App token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN do not run CI.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          github-token: ${{ steps.token.outputs.token }}
          version-script: pnpm run version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # @changesets/changelog-github reads this to link pull requests and commits.
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
