name: 🚀 Release

# Manual releases. Start it from the Actions tab:
#   dry-run  runs every check and writes the release report; publishes nothing
#   publish  runs the same checks, waits for your approval (environment npm-release), publishes
#            the exact tarball the checks inspected, tags it, creates the GitHub release, attests
#            the tarball, and verifies the result from npm
# npm trusted publishing is bound to this file name (release.yml) and the npm-release environment.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run shows exactly what would ship; publish ships it after your approval'
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: 🔍 Guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
      warnings: ${{ steps.guards.outputs.warnings }}
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 🔍 Check this commit can be released
        id: guards
        run: node scripts/release/release.mjs guards
        env:
          MODE: ${{ inputs.mode }}

  checks:
    name: 🔍 CI
    needs: guard
    permissions:
      contents: read
    # Kept workspace-relative: the reusable workflow runs from the same commit as this one.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] proven path for the release gate
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  preflight:
    name: 📦 Package and report
    needs: [guard, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache here: the tarball that ships is built from a clean install.
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: ⚙️ Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build the package
        run: bun run build
      - id: pack
        name: 📦 Pack once
        run: |
          mkdir -p out
          npm pack --pack-destination out
          # npm reads `out/x.tgz` as a GitHub shorthand (owner/repo); a ./ prefix makes it a path.
          tarball="./$(find out -name '*.tgz' | head -1)"
          {
            echo "tarball=$tarball"
            echo "name=$(basename "$tarball")"
            echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - id: publint
        name: 🔍 publint
        continue-on-error: true
        run: bunx publint@0.3.25
      - id: attw
        name: 🔷 Are the types wrong
        continue-on-error: true
        # Known and tracked: node10 subpath resolution, CommonJS default on /plugin, /loader, /runtime/*.
        run: bunx @arethetypeswrong/cli@0.18.5 "$TARBALL" --profile node16 --ignore-rules cjs-only-exports-default
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - id: smoke
        name: 🧪 Import smoke test
        continue-on-error: true
        run: node scripts/release/release.mjs smoke "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - id: publish-dry-run
        name: 📦 npm publish --dry-run
        continue-on-error: true
        run: npm publish "$TARBALL" --dry-run --access public
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - name: 📝 Release report
        run: node scripts/release/release.mjs report
        env:
          MODE: ${{ inputs.mode }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
          GUARD_WARNINGS: ${{ needs.guard.outputs.warnings }}
          PUBLINT_OUTCOME: ${{ steps.publint.outcome }}
          ATTW_OUTCOME: ${{ steps.attw.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PUBLISH_DRY_RUN_OUTCOME: ${{ steps.publish-dry-run.outcome }}
          RELEASE_REPORT: out/release-report.md
      - name: 📦 Upload the tarball and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: out/
          if-no-files-found: error
      - name: ❌ Stop if any check failed
        if: >-
          steps.publint.outcome != 'success' || steps.attw.outcome != 'success' ||
          steps.smoke.outcome != 'success' || steps.publish-dry-run.outcome != 'success'
        run: |
          echo "::error::A release check failed; see the release report."
          exit 1

  publish:
    name: 🚀 Publish (needs your approval)
    if: inputs.mode == 'publish'
    needs: [guard, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # npm trusted publishing and provenance, attestation signing
      attestations: write # store the tarball attestation
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Keeps the persisted credentials: the Tag step pushes with them.
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] the Tag step pushes; no artifacts are uploaded from this job
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: 📥 Download the checked tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: out
      - name: 🔍 Verify this is the tarball the report checked
        run: |
          actual=$(sha256sum "out/$NAME" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::sha256 mismatch: got $actual, expected $EXPECTED"
            exit 1
          fi
        env:
          NAME: ${{ needs.preflight.outputs.name }}
          EXPECTED: ${{ needs.preflight.outputs.sha256 }}
      - name: 🚀 Publish to npm (trusted publishing)
        run: npm publish "./out/$NAME" --provenance --access public
        env:
          NAME: ${{ needs.preflight.outputs.name }}
      - name: 🏷️ Tag
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ needs.guard.outputs.version }}
      - name: 📝 GitHub release
        run: |
          node scripts/release/release.mjs notes "$VERSION" > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag "./out/$NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          NAME: ${{ needs.preflight.outputs.name }}
      # Verify the release asset with: gh attestation verify <name>.tgz --repo <owner>/<repo>
      - name: 🔒 Attest the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ needs.preflight.outputs.name }}

  verify:
    name: ✅ Verify from npm
    needs: [guard, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: ✅ Verify the published package
        run: node scripts/release/release.mjs verify "$VERSION"
        env:
          VERSION: ${{ needs.guard.outputs.version }}
